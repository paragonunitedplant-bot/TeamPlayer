<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Tim & Poster Roster</title>
  <!-- Library html2canvas untuk Download Poster -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #3b82f6;
      --accent: #f59e0b;
      --bg: #f8fafc;
      --text: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 10px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
      color: var(--primary);
      font-size: 1.5rem;
    }

    .section-title {
      background-color: var(--primary);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      margin: 15px 0 10px 0;
      font-size: 1rem;
    }

    .team-title {
      background-color: #0284c7;
    }

    .captain-title {
      background-color: var(--accent);
      color: #000;
      font-weight: bold;
    }

    /* Perbaikan tampilan baris form agar responsif dan tidak menumpuk */
    .player-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
      padding: 12px;
      background-color: #f1f5f9;
      border-radius: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #334155;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      background-color: #fff;
    }

    button {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #059669;
    }

    /* Styles Tampilan Poster */
    #posterSection {
      display: none;
      margin-top: 20px;
    }

    .poster-container {
      background-color: #0f172a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .poster-header {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      text-align: center;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      border-bottom: 3px solid var(--accent);
    }

    .team-logo-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px;
      border-radius: 50%;
      border: 2px solid var(--accent);
    }

    .poster-header h1 {
      color: #ffffff;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0;
    }

    .poster-header p {
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .poster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      padding: 15px;
    }

    .card {
      background-color: #1e293b;
      border-radius: 8px;
      overflow: hidden;
      text-align: center;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      position: relative;
      border: 1px solid #334155;
    }

    .card.captain {
      border: 2px solid var(--accent);
    }

    .badge-captain {
      position: absolute;
      top: 6px;
      right: 6px;
      background-color: var(--accent);
      color: black;
      font-weight: bold;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      text-transform: uppercase;
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background-color: #334155;
    }

    .card-info {
      padding: 8px;
    }

    .card-number {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
    }

    .card-name {
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 4px;
      word-break: break-word;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-download {
      background-color: #3b82f6;
    }
    .btn-reset {
      background-color: #ef4444;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Form Input Pendaftaran -->
    <div id="formSection">
      <h1>Form Pendaftaran Tim</h1>
      <form id="teamForm">
        
        <!-- INFORMASI TIM & LOGO -->
        <div class="section-title team-title">Informasi Tim</div>
        <div class="player-row">
          <div class="form-group">
            <label>Nama Tim</label>
            <input type="text" id="team_name" placeholder="Contoh: Garuda FC">
          </div>
          <div class="form-group">
            <label>Logo Tim</label>
            <input type="file" id="team_logo" accept="image/*">
          </div>
        </div>

        <!-- KAPTEN TIM -->
        <div class="section-title captain-title">Kapten Tim (Pemain 1)</div>
        <div class="player-row">
          <div class="form-group">
            <label>Nama Kapten</label>
            <input type="text" id="captain_name" placeholder="Nama lengkap kapten">
          </div>
          <div class="form-group">
            <label>Nomor Punggung</label>
            <input type="number" id="captain_number" placeholder="Contoh: 10">
          </div>
          <div class="form-group">
            <label>Foto Kapten</label>
            <input type="file" id="captain_photo" accept="image/*">
          </div>
        </div>

        <!-- 14 PEMAIN LAINNYA -->
        <div class="section-title">Anggota Pemain (14 Orang)</div>
        <div id="playersContainer"></div>

        <button type="submit" id="submitBtn">Submit & Generate Poster Tim</button>
      </form>
    </div>

    <!-- Tampilan Poster Tim -->
    <div id="posterSection">
      <div class="poster-container" id="captureArea">
        <div class="poster-header">
          <img id="displayTeamLogo" class="team-logo-img" src="" alt="Logo Tim">
          <h1 id="displayTeamName">NAMA TIM</h1>
          <p>OFFICIAL SQUAD ROSTER (15 PEMAIN)</p>
        </div>
        <div class="poster-grid" id="posterGrid"></div>
      </div>
      
      <div class="action-buttons">
        <button type="button" class="btn-download" onclick="downloadPoster()">Download Poster (PNG)</button>
        <button type="button" class="btn-reset" onclick="window.location.reload()">Isi Form Kembali</button>
      </div>
    </div>
  </div>

  <script>
    const TOTAL_PLAYERS = 14; 
    const playersContainer = document.getElementById('playersContainer');

    // 1. Membuat Input Form untuk 14 Pemain secara otomatis
    for (let i = 1; i <= TOTAL_PLAYERS; i++) {
      const row = document.createElement('div');
      row.className = 'player-row';
      row.innerHTML = `
        <div class="form-group">
          <label>Nama Pemain ${i + 1}</label>
          <input type="text" class="p-name" placeholder="Nama lengkap">
        </div>
        <div class="form-group">
          <label>Nomor Punggung</label>
          <input type="number" class="p-number" placeholder="Contoh: ${i + 1}">
        </div>
        <div class="form-group">
          <label>Foto Pemain</label>
          <input type="file" class="p-photo" accept="image/*">
        </div>
      `;
      playersContainer.appendChild(row);
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve) => {
        if (!file) {
          resolve("https://via.placeholder.com/150?text=No+Photo");
          return;
        }
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => resolve("https://via.placeholder.com/150?text=Error");
        reader.readAsDataURL(file);
      });
    }

    // 2. Menangani Submit Form
    document.getElementById('teamForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.textContent = "Memproses Data...";
      submitBtn.disabled = true;

      const teamName = document.getElementById('team_name').value || "Tim Tanpa Nama";
      const teamLogoFile = document.getElementById('team_logo').files[0];
      const teamLogoUrl = await readFileAsDataURL(teamLogoFile);

      const playersData = [];

      // Data Kapten
      const captainName = document.getElementById('captain_name').value || "Kapten Tanpa Nama";
      const captainNumber = document.getElementById('captain_number').value || "-";
      const captainPhotoFile = document.getElementById('captain_photo').files[0];
      const captainPhotoUrl = await readFileAsDataURL(captainPhotoFile);

      playersData.push({
        name: captainName,
        number: captainNumber,
        photo: captainPhotoUrl,
        isCaptain: true
      });

      // Data 14 Pemain Lainnya
      const names = document.querySelectorAll('.p-name');
      const numbers = document.querySelectorAll('.p-number');
      const photos = document.querySelectorAll('.p-photo');

      for (let i = 0; i < TOTAL_PLAYERS; i++) {
        const pName = names[i].value || `Pemain ${i + 2}`;
        const pNum = numbers[i].value || "-";
        const photoUrl = await readFileAsDataURL(photos[i].files[0]);

        playersData.push({
          name: pName,
          number: pNum,
          photo: photoUrl,
          isCaptain: false
        });
      }

      // Render Poster di Layar
      renderPoster(teamName, teamLogoUrl, playersData);

      // --- KIRIM KE GOOGLE SHEETS ---
      const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwym3lrs_pUpeeiFUMo2XAy49wpUdit3oEQTiP_kfki7fvABpEOJ9yMiHF2XZi1JLCzLg/exec"; 
      
      fetch(GOOGLE_SHEET_URL, {
        method: "POST",
        body: JSON.stringify({ teamName, players: playersData }),
        headers: { "Content-Type": "text/plain;charset=utf-8" }
      })
      .then(response => response.json())
      .then(result => {
        console.log("Berhasil tersimpan ke Google Sheets:", result);
      })
      .catch(err => {
        console.log("Gagal kirim ke sheets:", err);
      });
    });

    // 3. Fungsi Render Poster Tim
    function renderPoster(teamName, teamLogoUrl, players) {
      document.getElementById('displayTeamName').textContent = teamName;
      document.getElementById('displayTeamLogo').src = teamLogoUrl;

      const posterGrid = document.getElementById('posterGrid');
      posterGrid.innerHTML = '';

      players.forEach(player => {
        const card = document.createElement('div');
        card.className = `card ${player.isCaptain ? 'captain' : ''}`;
        
        card.innerHTML = `
          ${player.isCaptain ? '<div class="badge-captain">Kapten</div>' : ''}
          <img src="${player.photo}" alt="${player.name}">
          <div class="card-info">
            <div class="card-number">#${player.number}</div>
            <div class="card-name">${player.name}</div>
          </div>
        `;
        posterGrid.appendChild(card);
      });

      document.getElementById('formSection').style.display = 'none';
      document.getElementById('posterSection').style.display = 'block';
      window.scrollTo(0, 0);
    }

    // 4. Fungsi Download Poster Menjadi Gambar PNG
    function downloadPoster() {
      const captureElement = document.getElementById('captureArea');
      
      html2canvas(captureElement, { scale: 2, useCORS: true }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'poster-squad-tim.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
