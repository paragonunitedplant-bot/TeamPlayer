<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Tim & Poster Roster</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #f59e0b;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg); padding: 15px; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: var(--primary); margin-bottom: 20px; }
    .section-title { background: var(--primary); color: #fff; padding: 8px 12px; border-radius: 6px; margin: 15px 0 10px; font-weight: bold; }
    .captain-title { background: var(--accent); color: #000; }
    .player-row { background: #f1f5f9; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-size: 0.85rem; font-weight: bold; color: #334155; }
    .form-group input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { width: 100%; padding: 14px; background: #10b981; color: #fff; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; }
    button:disabled { background: #9ca3af; }

    /* Style Poster */
    #posterSection { display: none; margin-top: 20px; }
    .poster-container { background: #0f172a; padding: 15px; border-radius: 12px; color: #fff; text-align: center; }
    .poster-header { border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 15px; }
    .poster-header h2 { color: var(--accent); text-transform: uppercase; }
    .poster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .card { background: #1e293b; border-radius: 8px; padding: 8px; text-align: center; position: relative; border: 1px solid #334155; }
    .card.captain { border: 2px solid var(--accent); }
    .badge { position: absolute; top: 4px; right: 4px; background: var(--accent); color: #000; font-size: 0.65rem; font-weight: bold; padding: 2px 4px; border-radius: 4px; }
    .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; background: #334155; }
    .card-num { color: var(--accent); font-weight: bold; font-size: 1.1rem; }
    .card-name { font-size: 0.85rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-download { background: #3b82f6; }
  </style>
</head>
<body>

  <div class="container">
    <div id="formSection">
      <h1>Pendaftaran Tim</h1>
      <form id="teamForm">
        <div class="section-title">Informasi Tim</div>
        <div class="player-row">
          <div class="form-group">
            <label>Nama Tim</label>
            <input type="text" id="teamName" required placeholder="Contoh: Garuda FC">
          </div>
        </div>

        <div class="section-title captain-title">Kapten Tim</div>
        <div class="player-row">
          <div class="form-group">
            <label>Nama Kapten</label>
            <input type="text" id="captainName" required placeholder="Nama Kapten">
          </div>
          <div class="form-group">
            <label>No. Punggung</label>
            <input type="number" id="captainNum" required placeholder="10">
          </div>
          <div class="form-group">
            <label>Foto Kapten</label>
            <input type="file" id="captainPhoto" accept="image/*">
          </div>
        </div>

        <div class="section-title">14 Pemain Tambahan</div>
        <div id="playersList"></div>

        <button type="submit" id="submitBtn">Kirim & Buat Poster</button>
      </form>
    </div>

    <!-- Tampilan Poster -->
    <div id="posterSection">
      <div class="poster-container" id="captureArea">
        <div class="poster-header">
          <h2 id="displayTeam">NAMA TIM</h2>
          <p>OFFICIAL SQUAD ROSTER</p>
        </div>
        <div class="poster-grid" id="posterGrid"></div>
      </div>
      <button class="btn-download" onclick="downloadPoster()">Download Poster (PNG)</button>
      <button onclick="window.location.reload()" style="background:#ef4444;">Isi Ulang Form</button>
    </div>
  </div>

  <script>
    // PASANG URL WEB APP GOOGLE APPS SCRIPT BERAKHIRAN /exec DI SINI
    const GOOGLE_SCRIPT_URL = "PASANG_URL_EXEC_DI_SINI";

    const playersList = document.getElementById('playersList');

    // Generate 14 Form Pemain
    for (let i = 1; i <= 14; i++) {
      const div = document.createElement('div');
      div.className = 'player-row';
      div.innerHTML = `
        <div class="form-group">
          <label>Nama Pemain ${i + 1}</label>
          <input type="text" class="p-name" placeholder="Nama Pemain">
        </div>
        <div class="form-group">
          <label>No. Punggung</label>
          <input type="number" class="p-num" placeholder="${i + 1}">
        </div>
        <div class="form-group">
          <label>Foto Pemain</label>
          <input type="file" class="p-photo" accept="image/*">
        </div>
      `;
      playersList.appendChild(div);
    }

    // Kompresi Gambar
    function processImage(file) {
      return new Promise((resolve) => {
        if (!file) resolve("");
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            const max = 250;
            if (w > h) { if (w > max) { h *= max / w; w = max; } }
            else { if (h > max) { w *= max / h; h = max; } }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('teamForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = "Memproses & Mengirim Data...";

      const teamName = document.getElementById('teamName').value;
      const captainName = document.getElementById('captainName').value;
      const captainNum = document.getElementById('captainNum').value;
      const captainPhoto = await processImage(document.getElementById('captainPhoto').files[0]);

      const names = document.querySelectorAll('.p-name');
      const nums = document.querySelectorAll('.p-num');
      const photos = document.querySelectorAll('.p-photo');

      const players = [];
      for (let i = 0; i < 14; i++) {
        const photoUrl = await processImage(photos[i].files[0]);
        players.push({
          name: names[i].value || `Pemain ${i + 2}`,
          number: nums[i].value || "-",
          photo: photoUrl
        });
      }

      // Tampilkan Poster Lengkap
      renderPoster(teamName, captainName, captainNum, captainPhoto, players);

      // Kirim Data Ke Google Sheets & Drive
      if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== "https://script.google.com/macros/s/AKfycbzhjw27WcO8fiKSrQHwf6rJoQFtfTYfSb0i_ZSOJPPJd_z1o8CxajNWDePG9PXliwiZAA/exec") {
        fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            teamName: teamName,
            captainName: captainName,
            captainNumber: captainNum,
            captainPhoto: captainPhoto,
            players: players
          }),
          headers: { "Content-Type": "text/plain;charset=utf-8" }
        })
        .then(res => res.json())
        .then(res => console.log("Response:", res))
        .catch(err => console.error("Error:", err));
      }
    });

    function renderPoster(team, capName, capNum, capPhoto, players) {
      document.getElementById('displayTeam').textContent = team;
      const grid = document.getElementById('posterGrid');
      grid.innerHTML = '';

      // Tambah Kapten
      grid.innerHTML += `
        <div class="card captain">
          <span class="badge">KAPTEN</span>
          <img src="${capPhoto || 'https://via.placeholder.com/150'}" alt="Foto">
          <div class="card-num">#${capNum}</div>
          <div class="card-name">${capName}</div>
        </div>
      `;

      // Tambah 14 Pemain
      players.forEach(p => {
        grid.innerHTML += `
          <div class="card">
            <img src="${p.photo || 'https://via.placeholder.com/150'}" alt="Foto">
            <div class="card-num">#${p.number}</div>
            <div class="card-name">${p.name}</div>
          </div>
        `;
      });

      document.getElementById('formSection').style.display = 'none';
      document.getElementById('posterSection').style.display = 'block';
    }

    function downloadPoster() {
      html2canvas(document.getElementById('captureArea'), { scale: 2 }).then(canvas => {
        const a = document.createElement('a');
        a.download = 'Poster_Roster.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      });
    }
  </script>
</body>
</html>
