<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Tim & Poster Roster</title>
  <!-- Library html2canvas untuk Download Poster -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #3b82f6;
      --accent: #f59e0b;
      --bg: #f8fafc;
      --text: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 10px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
      color: var(--primary);
      font-size: 1.5rem;
    }

    .section-title {
      background-color: var(--primary);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      margin: 15px 0 10px 0;
      font-size: 1rem;
    }

    .team-title {
      background-color: #0284c7;
    }

    .captain-title {
      background-color: var(--accent);
      color: #000;
      font-weight: bold;
    }

    .player-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
      padding: 12px;
      background-color: #f1f5f9;
      border-radius: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #334155;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      background-color: #fff;
    }

    button {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #059669;
    }

    button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    /* Styles Tampilan Poster */
    #posterSection {
      display: none;
      margin-top: 20px;
    }

    .poster-container {
      background-color: #0f172a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .poster-header {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      text-align: center;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      border-bottom: 3px solid var(--accent);
    }

    .team-logo-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px;
      border-radius: 50%;
      border: 2px solid var(--accent);
    }

    .poster-header h1 {
      color: #ffffff;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0;
    }

    .poster-header p {
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .poster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      padding: 15px;
    }

    .card {
      background-color: #1e293b;
      border-radius: 8px;
      overflow: hidden;
      text-align: center;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      position: relative;
      border: 1px solid #334155;
    }

    .card.captain {
      border: 2px solid var(--accent);
    }

    .badge-captain {
      position: absolute;
      top: 6px;
      right: 6px;
      background-color: var(--accent);
      color: black;
      font-weight: bold;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      text-transform: uppercase;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      object-position: center;
      background-color: #334155;
    }

    .card-info {
      padding: 8px;
    }

    .card-number {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
    }

    .card-name {
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 4px;
      word-break: break-word;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-download {
      background-color: #3b82f6;
    }
    .btn-reset {
      background-color: #ef4444;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Form Input Pendaftaran -->
    <div id="formSection">
      <h1>Form Pendaftaran Tim</h1>
      <form id="teamForm">
        
        <!-- INFORMASI TIM & LOGO -->
        <div class="section-title team-title">Informasi Tim</div>
        <div class="player-row">
          <div class="form-group">
            <label>Nama Tim</label>
            <input type="text" id="team_name" placeholder="Contoh: Garuda FC" required>
          </div>
          <div class="form-group">
            <label>Logo Tim</label>
            <input type="file" id="team_logo" accept="image/*">
          </div>
        </div>

        <!-- KAPTEN TIM -->
        <div class="section-title captain-title">Kapten Tim (Pemain 1)</div>
        <div class="player-row">
          <div class="form-group">
            <label>Nama Kapten</label>
            <input type="text" id="captain_name" placeholder="Nama lengkap kapten" required>
          </div>
          <div class="form-group">
            <label>Nomor Punggung</label>
            <input type="number" id="captain_number" placeholder="Contoh: 10" required>
          </div>
          <div class="form-group">
            <label>Foto Kapten</label>
            <input type="file" id="captain_photo" accept="image/*">
          </div>
        </div>

        <!-- 14 PEMAIN LAINNYA -->
        <div class="section-title">Anggota Pemain (14 Orang)</div>
        <div id="playersContainer"></div>

        <button type="submit" id="submitBtn">Submit & Generate Poster Tim</button>
      </form>
    </div>

    <!-- Tampilan Poster Tim -->
    <div id="posterSection">
      <div class="poster-container" id="captureArea">
        <div class="poster-header">
          <img id="displayTeamLogo" class="team-logo-img" src="" alt="Logo Tim">
          <h1 id="displayTeamName">NAMA TIM
