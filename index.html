<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran & Roster Tim Turnamen</title>
  <!-- Pustaka html2canvas untuk generate poster menjadi gambar PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --border-color: #d1d5db;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      background: var(--card-bg);
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      margin: auto;
    }
    h2 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 25px;
    }
    h3 {
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 8px;
      margin-top: 25px;
      color: #374151;
      font-size: 1.1rem;
    }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
    input[type="text"], input[type="number"], select {
      width: 100%; padding: 10px; box-sizing: border-box;
      border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.95rem;
    }
    input[type="file"] { padding: 6px; border: 1px dashed var(--border-color); border-radius: 8px; width: 100%; background: #fafafa; }
    button {
      background: var(--primary); color: white; padding: 14px; border: none;
      border-radius: 8px; cursor: pointer; width: 100%; font-size: 1rem; font-weight: bold; margin-top: 15px;
    }
    button:hover { background: var(--primary-hover); }
    .player-card { background: #f9fafb; padding: 15px; margin-bottom: 12px; border: 1px solid #e5e7eb; border-radius: 10px; }

    /* ================= TAMPILAN POSTER ROSTER TIM ================= */
    #posterResultArea { display: none; text-align: center; }
    
    #teamPoster {
      width: 650px;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #ffffff;
      padding: 30px;
      border-radius: 16px;
      margin: 20px auto;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
      box-sizing: border-box;
    }
    .poster-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid rgba(255,255,255,0.2);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .poster-logo-box { width: 80px; height: 80px; border-radius: 12px; overflow: hidden; background: #334155; display: flex; align-items: center; justify-content: center; }
    .poster-logo-box img { width: 100%; height: 100%; object-fit: cover; }
    .poster-team-info { text-align: right; }
    .poster-team-name { font-size: 1.8rem; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin: 0; }
    .poster-dept-name { font-size: 1rem; color: #cbd5e1; margin-top: 4px; }
    
    .captain-section {
      background: rgba(255,255,255,0.08);
      padding: 12px 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      border-left: 4px solid #f59e0b;
    }
    .captain-avatar { width: 55px; height: 55px; border-radius: 50%; overflow: hidden; background: #475569; }
    .captain-avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    .players-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }
    .player-box {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .player-box-photo { width: 100%; height: 65px; border-radius: 6px; overflow: hidden; background: #334155; margin-bottom: 6px; }
    .player-box-photo img { width: 100%; height: 100%; object-fit: cover; }
    .player-box-name { font-size: 0.75rem; font-weight: bold; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-box-no { font-size: 0.7rem; color: #38bdf8; font-weight: bold; }
    
    .poster-footer {
      margin-top: 20px;
      font-size: 0.75rem;
      color: #94a3b8;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 10px;
    }
    .action-btn {
      background: #10b981; color: white; padding: 12px 24px; border: none;
      border-radius: 8px; font-weight: bold; cursor: pointer; margin: 10px 5px; width: auto; display: inline-block;
    }
  </style>
</head>
<body>

  <!-- ================= FORM PENDAFTARAN ================= -->
  <div class="container" id="formArea">
    <h2>Form Pendaftaran Tim</h2>
    <form id="registrationForm">
      
      <!-- Informasi Tim -->
      <div class="form-group">
        <label for="teamName">Nama Tim:</label>
        <input type="text" id="teamName" placeholder="Masukkan nama tim...">
      </div>

      <div class="form-group">
        <label for="department">Departemen:</label>
        <select id="department">
          <option value="">-- Pilih Departemen --</option>
          <option value="Downstream Liquid">Downstream Liquid</option>
          <option value="Downstream Powder">Downstream Powder</option>
          <option value="Downstream Semsol">Downstream Semsol</option>
          <option value="FM">FM</option>
          <option value="Logistik 1">Logistik 1</option>
          <option value="Logistik 2">Logistik 2</option>
          <option value="NDC">NDC</option>
          <option value="RND">RND</option>
          <option value="Upstream Liquid">Upstream Liquid</option>
          <option value="Upstream Powder">Upstream Powder</option>
          <option value="Upstream Semsol">Upstream Semsol</option>
        </select>
      </div>

      <div class="form-group">
        <label for="teamLogo">Upload Logo Tim:</label>
        <input type="file" id="teamLogo" accept="image/*">
      </div>

      <h3>Data Kapten</h3>
      <div class="form-group">
        <label for="captainName">Nama Kapten:</label>
        <input type="text" id="captainName" placeholder="Nama kapten...">
      </div>
      <div class="form-group">
        <label for="captainNumber">Nomor Punggung Kapten:</label>
        <input type="number" id="captainNumber" placeholder="Contoh: 10">
      </div>
      <div class="form-group">
        <label for="captainPhoto">Foto Kapten:</label>
        <input type="file" id="captainPhoto" accept="image/*">
      </div>

      <h3>Data 14 Pemain Tambahan</h3>
      <div id="playersContainer"></div>

      <button type="submit" id="submitBtn">Kirim Pendaftaran</button>
    </form>
  </div>

  <!-- ================= HASIL POSTER ROSTER TIM ================= -->
  <div id="posterResultArea">
    <h2 style="color: #10b981;">Pendaftaran Berhasil!</h2>
    <p>Berikut adalah Kartu Roster Resmi Tim Anda yang baru saja dibuat:</p>

    <!-- KANVAS/DESAIN POSTER (Akan di-render oleh JavaScript) -->
    <div id="teamPoster">
      <div class="poster-header">
        <div class="poster-logo-box">
          <img id="pTeamLogo" src="" alt="Logo">
        </div>
        <div class="poster-team-info">
          <p class="poster-team-name" id="pTeamName">NAMA TIM</p>
          <p class="poster-dept-name" id="pDeptName">Departemen</p>
        </div>
      </div>

      <!-- Kapten -->
      <div class="captain-section">
        <div class="captain-avatar">
          <img id="pCaptainPhoto" src="" alt="Kapten">
        </div>
        <div style="text-align: left;">
          <div style="font-size: 0.75rem; color: #f59e0b; font-weight: bold;">KAPTEN TIM</div>
          <div id="pCaptainName" style="font-size: 1rem; font-weight: bold;">-</div>
          <div id="pCaptainNo" style="font-size: 0.8rem; color: #94a3b8;">No. -</div>
        </div>
      </div>

      <!-- Grid 14 Pemain -->
      <div class="players-grid" id="pPlayersGrid"></div>

      <div class="poster-footer">
        ROSTER RESMI TURNAMEN FUTSAL • REGISTRASI BERHASIL
      </div>
    </div>

    <!-- Tombol Aksi -->
    <button class="action-btn" onclick="downloadPoster()">Download Poster PNG</button>
    <button class="action-btn" onclick="resetForm()" style="background: #64748b;">Daftarkan Tim Lain</button>
  </div>

<script>
  // Generate 14 Input Pemain (Tanpa required)
  const playersContainer = document.getElementById('playersContainer');
  for (let i = 1; i <= 14; i++) {
    playersContainer.innerHTML += `
      <div class="player-card">
        <h4>Pemain ${i + 1}</h4>
        <div class="form-group">
          <label>Nama Pemain:</label>
          <input type="text" class="playerName" placeholder="Nama pemain...">
        </div>
        <div class="form-group">
          <label>Nomor Punggung:</label>
          <input type="number" class="playerNumber" placeholder="Nomor...">
        </div>
        <div class="form-group">
          <label>Foto Pemain:</label>
          <input type="file" class="playerPhoto" accept="image/*">
        </div>
      </div>
    `;
  }

  function toBase64(file) {
    return new Promise((resolve) => {
      if (!file) resolve(null);
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => resolve(null);
    });
  }

  // Placeholder Gambar Default jika Foto Kosong
  const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%2364748b'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";

  document.getElementById('registrationForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "Mengirim data & membuat poster...";

    try {
      const teamNameVal = document.getElementById('teamName').value || "TANPA NAMA";
      const deptVal = document.getElementById('department').value || "DEPARTEMEN";
      
      const teamLogoFile = document.getElementById('teamLogo').files[0];
      const captainPhotoFile = document.getElementById('captainPhoto').files[0];

      const teamLogoBase64 = await toBase64(teamLogoFile);
      const captainPhotoBase64 = await toBase64(captainPhotoFile);

      const playerElements = document.querySelectorAll('.player-card');
      const players = [];
      const gridContainer = document.getElementById('pPlayersGrid');
      gridContainer.innerHTML = "";

      // Loop data 14 pemain
      for (let [idx, card] of playerElements.entries()) {
        const name = card.querySelector('.playerName').value || `Pemain ${idx + 2}`;
        const number = card.querySelector('.playerNumber').value || "-";
        const photoFile = card.querySelector('.playerPhoto').files[0];
        const photoBase64 = await toBase64(photoFile);

        players.push({ name, number, photo: photoBase64 });

        // Susun HTML Elemen Poster untuk setiap pemain
        gridContainer.innerHTML += `
          <div class="player-box">
            <div class="player-box-photo">
              <img src="${photoBase64 || defaultAvatar}">
            </div>
            <div class="player-box-name">${name}</div>
            <div class="player-box-no">#${number}</div>
          </div>
        `;
      }

      // Populate Data ke Poster
      document.getElementById('pTeamName').innerText = teamNameVal;
      document.getElementById('pDeptName').innerText = deptVal;
      document.getElementById('pTeamLogo').src = teamLogoBase64 || defaultAvatar;
      document.getElementById('pCaptainName').innerText = document.getElementById('captainName').value || "Kapten Tim";
      document.getElementById('pCaptainNo').innerText = "No. " + (document.getElementById('captainNumber').value || "-");
      document.getElementById('pCaptainPhoto').src = captainPhotoBase64 || defaultAvatar;

      // Payload Kirim ke Backend
      const payload = {
        teamName: teamNameVal,
        department: deptVal,
        teamLogo: teamLogoBase64,
        captainName: document.getElementById('captainName').value || "-",
        captainNumber: document.getElementById('captainNumber').value || "-",
        captainPhoto: captainPhotoBase64,
        players: players
      };

      const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMbpV07imywyF8YHLlKdh-4NQWMTy_RToVjD-8XtbNvw07sL7yisBBuvtn0x6geVZ4hw/exec"; // Ganti dengan URL /exec Apps Script Anda

      const response = await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status === "success") {
        // Tampilkan poster & sembunyikan form
        document.getElementById('formArea').style.display = 'none';
        document.getElementById('posterResultArea').style.display = 'block';
        window.scrollTo(0, 0);
      } else {
        alert("Gagal kirim data: " + result.message);
      }

    } catch (err) {
      alert("Terjadi kesalahan: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "Kirim Pendaftaran";
    }
  });

  // Fungsi Download Poster sebagai File Gambar PNG
  function downloadPoster() {
    const posterElem = document.getElementById('teamPoster');
    html2canvas(posterElem, { scale: 2 }).then(canvas => {
      const link = document.createElement('a');
      link.download = `Roster_${document.getElementById('pTeamName').innerText}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }

  function resetForm() {
    document.getElementById('posterResultArea').style.display = 'none';
    document.getElementById('formArea').style.display = 'block';
    document.getElementById('registrationForm').reset();
  }
</script>

</body>
</html>
